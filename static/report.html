<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview report</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<nav><a href="/">New interview</a><a href="/history.html">History</a></nav>
<main>
  <h1 id="title">Interview report</h1>
  <p id="meta" class="sub"></p>
  <p id="msg" role="status" class="status">Loading…</p>

  <section id="results" class="card hidden" aria-live="polite"></section>
  <section id="share" class="card hidden">
    <h2>Share your scorecard</h2>
    <p class="muted">Anyone with the link sees your name, role, scores and summary. Never the transcript, code or recording.</p>
    <div id="shareBox"></div>
  </section>
  <section id="delivery" class="card hidden"><h2>Delivery</h2></section>
  <section id="peerFeedback" class="card hidden"><h2>Feedback for the interviewer</h2></section>
  <section id="replay" class="card hidden">
    <h2>Replay</h2>
    <audio id="player" controls preload="auto"></audio>
  </section>
  <section id="questions" class="card hidden"><h2>Question by question</h2></section>
  <section id="code" class="card hidden"><h2>Your code</h2></section>
  <section id="transcript" class="card hidden"><h2>Transcript</h2></section>
  <button id="deleteBtn" class="end" type="button">Delete this interview</button>
</main>

<script src="/common.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
let hasAudio = false;

function seek(seconds) {
  if (!hasAudio) return;
  const p = $('player');
  p.currentTime = Math.max(0, seconds - 1);  // captions arrive ~1 s after speech starts
  p.play();
  $('replay').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function loadRecording() {
  // Fetch the whole file: MediaRecorder webm has no seek index, so it only seeks reliably from memory.
  const blob = await (await api(`/api/sessions/${id}/recording`)).blob();
  const p = $('player');
  p.src = URL.createObjectURL(blob);
  p.addEventListener('loadedmetadata', () => {
    if (p.duration !== Infinity) return;
    // Chrome reports Infinity for MediaRecorder webm until it has scanned to the end once.
    p.currentTime = 1e101;
    p.addEventListener('timeupdate', () => { p.currentTime = 0; }, { once: true });
  }, { once: true });
  hasAudio = true;
  $('replay').classList.remove('hidden');
}

function playButton(seconds, label) {
  const b = el('button', label ?? `▶ ${fmtTime(seconds)}`, 'small');
  b.type = 'button';
  b.setAttribute('aria-label', `Play recording from ${fmtTime(seconds)}`);
  b.onclick = () => seek(seconds);
  return b;
}

function render(s) {
  const ev = s.evaluation;
  const r = $('results'); r.replaceChildren(); r.classList.remove('hidden');
  if (s.challenge) r.append(el('p', ev.hiringRecommendation === 'Yes' ? '🏆 You survived the bar-raiser!' : 'The bar-raiser won this time. Try again!', 'pill'));
  r.append(el('h2', `Recommendation: ${ev.hiringRecommendation}`), el('p', ev.overallFeedback));
  for (const sc of ev.scores) {
    const row = el('div', null, 'score');
    row.append(el('div', sc.score ?? '–', 'n'));
    const d = el('div'); d.append(el('b', sc.dimension + (sc.score == null ? ' (not assessed)' : '')), el('div', sc.justification));
    row.append(d); r.append(row);
  }
  const pdf = el('a', 'Download PDF report', 'btn'); pdf.href = `/api/sessions/${id}/report.pdf`; r.append(pdf);

  const qs = $('questions'); qs.classList.remove('hidden');
  for (const q of ev.questions) {
    const d = el('div', null, 'q'), head = el('div', null, 'q-head');
    head.append(el('b', q.question));
    if (hasAudio && q.askedAtSeconds != null) head.append(playButton(q.askedAtSeconds));
    d.append(head);
    for (const [k, v] of [['You said', q.answerSummary], ['Strong answer', q.modelAnswer], ['Missing', q.missing]]) {
      const p = el('p'); p.append(el('b', k + ': '), document.createTextNode(v)); d.append(p);
    }
    qs.append(d);
  }

  const code = Object.entries(s.code || {}).filter(([, c]) => c.trim());
  if (code.length) {
    $('code').classList.remove('hidden');
    for (const [i, c] of code) {
      const t = s.test_results?.[i];
      $('code').append(el('h3', s.topics[+i]?.topic ?? 'Coding'),
        el('p', t ? `${t.passed} / ${t.total} tests passed (${t.language})` : `Tests not run (${s.language})`, 'muted'), el('pre', c));
    }
  }
  for (const [i, d] of Object.entries(s.diagram || {})) {
    if (!d.svg && !d.text) continue;
    $('code').classList.remove('hidden');
    $('code').append(el('h3', `Whiteboard: ${s.topics[+i]?.topic ?? 'Design'}`));
    if (d.svg) {
      const img = el('img', null, 'diagram'); img.alt = 'Your whiteboard diagram'; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(d.svg);
      $('code').append(img);
    }
    if (d.text) $('code').append(el('pre', d.text));
  }

  renderDelivery(s.speech);
  if (s.peer_feedback) { $('peerFeedback').classList.remove('hidden'); $('peerFeedback').append(el('p', s.peer_feedback)); }
  if (s.owner) renderShare(s.share_token);

  const t = $('transcript'); t.classList.remove('hidden');
  for (const turn of s.turns) {
    const d = el('div', null, 'turn ' + turn.speaker);
    if (hasAudio) d.append(playButton(turn.t_ms / 1000, fmtTime(turn.t_ms / 1000)));
    d.append(el('b', turn.speaker === 'ai' ? 'Interviewer: ' : s.owner ? 'You: ' : 'Candidate: '), el('span', turn.text));
    t.append(d);
  }
}

function renderDelivery(sp) {
  if (!sp) return;
  const box = $('delivery'); box.classList.remove('hidden');
  const tiles = el('div', null, 'tiles');
  const tile = (n, label, note) => { const t = el('div', null, 'tile'); t.append(el('div', n, 'n'), el('div', label), el('div', note, 'muted')); tiles.append(t); };
  tile(sp.wpm ?? '–', 'words per minute', sp.wpm == null ? 'not enough timed speech' : sp.wpm < 110 ? 'on the slow side' : sp.wpm > 170 ? 'quite fast: slow down a little' : 'a comfortable pace');
  tile(sp.fillers_per_100_words, 'filler words per 100', sp.fillers_per_100_words > 3 ? 'try pausing instead' : 'nicely controlled');
  tile(sp.words, 'words spoken', '');
  box.append(tiles);
  const top = Object.entries(sp.fillers).slice(0, 5).map(([w, n]) => `"${w}" ×${n}`).join(', ');
  if (top) box.append(el('p', `Most used: ${top}`, 'muted'));
  box.append(el('p', 'Counted from speech-to-text, which drops some fillers, so treat these as a lower bound.', 'muted'));
}

function renderShare(token) {
  const box = $('shareBox'); box.replaceChildren(); $('share').classList.remove('hidden');
  if (!token) {
    const b = el('button', 'Create share link'); b.type = 'button';
    b.onclick = async () => { b.disabled = true; try { renderShare((await api(`/api/sessions/${id}/share`, { method: 'POST' })).token); } catch (err) { box.append(el('p', err.message, 'error')); b.disabled = false; } };
    box.append(b); return;
  }
  const link = el('input'); link.readOnly = true; link.value = `${location.origin}/scorecard.html?t=${token}`; link.setAttribute('aria-label', 'Share link');
  const copy = el('button', 'Copy link', 'small'); copy.type = 'button';
  copy.onclick = () => navigator.clipboard.writeText(link.value).then(() => { copy.textContent = 'Copied'; });
  const stop = el('button', 'Stop sharing', 'small link'); stop.type = 'button';
  stop.onclick = async () => { await api(`/api/sessions/${id}/share`, { method: 'DELETE' }); renderShare(''); };
  const row = el('div', null, 'editor-bar'); row.append(copy, stop);
  box.append(link, row);
}

$('deleteBtn').onclick = async () => {
  if (!confirm('Delete this interview, its transcript and its recording? This cannot be undone.')) return;
  try { await api(`/api/sessions/${id}`, { method: 'DELETE' }); location.href = '/history.html'; }
  catch (err) { $('msg').textContent = err.message; $('msg').className = 'error'; $('msg').classList.remove('hidden'); }
};

(async () => {
  try {
    if (!id) throw new Error('No interview selected.');
    let s = await api(`/api/sessions/${id}`);
    $('title').textContent = `${s.name}: ${s.role}`;
    $('meta').textContent = [fmtDate(s.created_at), s.difficulty, s.mode === 'peer' ? 'Peer mock' : PERSONA_LABELS[s.persona],
      s.company && `${s.company} style`, s.challenge && 'Bar-raiser challenge'].filter(Boolean).join(' · ');
    if (!s.owner) $('deleteBtn').classList.add('hidden');
    if (s.recording) await loadRecording().catch(err => console.warn('recording unavailable', err));
    if (!s.evaluation) {
      if (!s.turns.some(t => t.speaker === 'user')) throw new Error('This interview has no answers to evaluate.');
      $('msg').textContent = 'Evaluating your answers… (about 15 seconds)';
      s.evaluation = await api(`/api/sessions/${id}/evaluate`, { method: 'POST' });
    }
    $('msg').classList.add('hidden');
    render(s);
  } catch (err) {
    $('msg').textContent = err.message; $('msg').className = 'error';
    const retry = el('button', 'Try again'); retry.onclick = () => location.reload(); $('msg').after(retry);
  }
})();
</script>
</body>
</html>
