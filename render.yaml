# Render Blueprint: New > Blueprint in the Render dashboard, pick this repo.
services:
  - type: web
    name: ai-interviewer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-server.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/config
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: GEMINI_API_KEY
        sync: false  # you paste it in the dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-interviewer-db
          property: connectionString
      - key: INTERVIEWS_PER_DAY
        value: "3"
      - key: DAILY_INTERVIEW_CAP
        value: "100"

databases:
  - name: ai-interviewer-db
    plan: free
